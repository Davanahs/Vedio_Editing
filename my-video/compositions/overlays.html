<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <title>Overlays</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@700;800;900&display=swap');

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: transparent;
      }

      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        pointer-events: none;
      }

      .overlay-element {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 24px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65), 0 0 20px rgba(255, 230, 0, 0.25);
        opacity: 0;
        z-index: 50;
      }

      /* Hook Card at top */
      #hook-card {
        top: 240px;
        left: 50%;
        transform: translateX(-50%);
        width: 860px;
        height: 88px;
        background: #FFE600;
        color: #0D0E13;
        gap: 16px;
        border: 3px solid #FFFFFF;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 230, 0, 0.5);
      }

      .hook-emoji {
        font-size: 42px;
      }

      .hook-text {
        font-family: 'Bebas Neue', sans-serif;
        font-size: 50px;
        letter-spacing: 0.04em;
        line-height: 1;
      }

      /* CTA Banner at bottom */
      #cta-banner {
        bottom: 240px;
        left: 50%;
        transform: translateX(-50%);
        width: 860px;
        height: 96px;
        background: linear-gradient(90deg, #FFE600, #FFB800);
        color: #0D0E13;
        gap: 20px;
        border: 3px solid #FFFFFF;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.9), 0 0 40px rgba(255, 230, 0, 0.6);
      }

      .cta-arrow {
        font-size: 46px;
        animation: bounce 1s infinite alternate;
      }

      .cta-text {
        font-family: 'Bebas Neue', sans-serif;
        font-size: 56px;
        letter-spacing: 0.05em;
        line-height: 1;
      }

      .logo-popup-content {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 12px 28px;
        color: #FFFFFF;
      }

      .badge-icon {
        font-size: 38px;
      }

      .badge-label {
        font-family: 'Bebas Neue', sans-serif;
        font-size: 44px;
        letter-spacing: 0.03em;
        line-height: 1;
      }

      .emoji-big {
        font-size: 110px;
        filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.7));
      }

      @keyframes bounce {
        0% { transform: translateY(0); }
        100% { transform: translateY(8px); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Top Hook Badge -->
      <div id="hook-card" class="overlay-element" data-start="0.100" data-duration="2.900" data-layout-allow-safe-zone>
        <span class="hook-emoji">🎉</span>
        <span class="hook-text">FIRST TIME FINALLY POSTING</span>
      </div>
      <div id="overlay_gfx_0_gemini" class="overlay-element anim-spring_in" 
           style="top: 140px; left: 540px; width: 500px; min-height: 180px; background: rgba(20, 24, 38, 0.92); border: 2px solid rgba(255, 230, 0, 0.4);" 
           data-start="0.800" data-duration="2.400" data-layout-allow-safe-zone>
        <div class="logo-popup-content"><span class="badge-icon">✨</span><span class="badge-label">TITLE: ⚡ GEMINI NOTEBOOKLM • AI TOOLS 🤖</span></div>
      </div>
      <!-- Bottom CTA Banner -->
      <div id="cta-banner" class="overlay-element" data-start="47.850" data-duration="2.950" data-layout-allow-safe-zone>
        <span class="cta-arrow">👇</span>
        <span class="cta-text">FOLLOW FOR MORE</span>
        <span class="cta-arrow">👇</span>
      </div>
    </div>

    <audio id="sfx_0_whoosh" src="../assets/whoosh.wav" preload="auto" data-start="0.800" data-duration="0.250"></audio>

    <script>
      // GSAP In/Out animations for overlays
      document.querySelectorAll('.overlay-element').forEach((el) => {
        const start = parseFloat(el.getAttribute('data-start') || '0');
        const dur = parseFloat(el.getAttribute('data-duration') || '1');
        
        // Elastic spring-in
        gsap.timeline()
          .fromTo(el,
            { opacity: 0, scale: 0.4, y: 30 },
            { opacity: 1, scale: 1, y: 0, duration: 0.35, ease: "back.out(1.8)", delay: start }
          )
          .to(el,
            { opacity: 0, scale: 0.8, y: -20, duration: 0.2, ease: "power2.in", delay: Math.max(0, dur - 0.55) }
          );
      });
    </script>
  </body>
</html>
