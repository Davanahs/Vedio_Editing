version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: reel-postgres
    environment:
      POSTGRES_USER: reeluser
      POSTGRES_PASSWORD: reelpass
      POSTGRES_DB: reeldb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./engine/db/migrations:/docker-entrypoint-initdb.d
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: reel-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: reel-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    profiles:
      - local-ai
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  ollama-data:
