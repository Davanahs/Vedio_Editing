<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <title>AI Reel Export</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0D0E13;
      }

      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: radial-gradient(circle at 50% 35%, #1B1E2E 0%, #0D0E13 65%, #07080B 100%);
      }

      .bg-overlay {
        position: absolute;
        inset: 0;
        opacity: 0.12;
        background-image: repeating-linear-gradient(90deg, #FFFFFF 0px, #FFFFFF 2px, transparent 2px, transparent 40px);
        pointer-events: none;
      }

      #footage {
        position: absolute;
        top: 450px;
        left: 60px;
        width: 960px;
        height: 544px;
        border-radius: 28px;
        object-fit: cover;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(255, 230, 0, 0.2);
        border: 2px solid rgba(255, 255, 255, 0.15);
        z-index: 10;
        transform-origin: center center;
      }

      .sub-comp {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        pointer-events: none;
      }

      #overlays-layer {
        z-index: 20;
      }

      #captions-layer {
        z-index: 30;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="50.85" data-width="1080" data-height="1920">
      <div class="bg-overlay"></div>

      <!-- Main Video Footage -->
      <video id="footage" class="clip" src="assets/footage.mp4" data-start="0" data-duration="50.85" data-has-audio="true" preload="auto"></video>

      <!-- Sub-Compositions -->
      <div id="overlays-layer" class="clip sub-comp" data-composition-src="compositions/overlays.html" data-composition-id="overlays" data-start="0" data-duration="50.85"></div>

      <div id="captions-layer" class="clip sub-comp" data-composition-src="compositions/captions.html" data-composition-id="captions" data-start="0" data-duration="50.85"></div>

      <audio id="bgm" src="assets/bgm.wav" data-start="0" data-duration="50.85" data-track-index="1"></audio>
      <audio id="root_sfx_0" src="assets/whoosh.wav" data-start="0.80" data-duration="0.5"></audio>
    </div>

    <script>
      // Camera Zoom Timeline
      // No zoom events
    </script>
  </body>
</html>
