<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <title>First Video Reel</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0D0E13;
      }

      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: radial-gradient(circle at 50% 35%, #1B1E2E 0%, #0D0E13 65%, #07080B 100%);
      }

      .bg-overlay {
        position: absolute;
        inset: 0;
        opacity: 0.12;
        background-image: repeating-linear-gradient(90deg, #FFFFFF 0px, #FFFFFF 2px, transparent 2px, transparent 40px);
        pointer-events: none;
      }

      #footage {
        position: absolute;
        top: 450px;
        left: 60px;
        width: 960px;
        height: 544px;
        border-radius: 28px;
        object-fit: cover;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(255, 230, 0, 0.2);
        border: 2px solid rgba(255, 255, 255, 0.15);
        z-index: 10;
        transform-origin: center center;
      }

      .sub-comp {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
        pointer-events: none;
      }

      #overlays-layer {
        z-index: 20;
      }

      #captions-layer {
        z-index: 30;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-g2yq" id="root" data-composition-id="main" data-start="0" data-duration="46.6" data-width="1080" data-height="1920">
      <div data-hf-id="hf-jese" class="bg-overlay"></div>

      <!-- Main Video Footage -->
      <video data-hf-id="hf-hkhm" id="footage" class="clip" src="assets/footage.mp4" data-start="0" data-duration="46.6" data-has-audio="true" preload="auto"></video>

      <!-- Sub-Compositions -->
      <div data-hf-id="hf-hpwp" id="overlays-layer" class="clip sub-comp" data-composition-src="compositions/overlays.html" data-composition-id="overlays" data-start="0" data-duration="46.6"></div>

      <div data-hf-id="hf-z4af" id="captions-layer" class="clip sub-comp" data-composition-src="compositions/captions.html" data-composition-id="captions" data-start="0" data-duration="46.6"></div>

      <!-- Audio Elements with exact timing attributes -->
      <audio data-hf-id="hf-3k5o" id="bgm" src="assets/bgm.wav" data-start="0" data-duration="46.6" data-track-index="1"></audio>
      <audio data-hf-id="hf-6r6b" id="sfx-pop" src="assets/pop.wav" data-start="3.8" data-duration="0.12"></audio>
      <audio data-hf-id="hf-uv42" id="sfx-ding" src="assets/ding.wav" data-start="43.5" data-duration="1.2"></audio>
    </div>

    <script>
gsap.set("#footage", { x: 12, y: 164.972 });
      const tl = gsap.timeline({ paused: true });

      // Camera Angle resets and punch-ins on key impact moments
      tl.to("#footage", { scale: 1.0, duration: 0.1 }, 0);

      // 9.45s: "CONGRATULATE ME" -> Punch-in 1.15x
      tl.to("#footage", { scale: 1.15, duration: 0.25, ease: "back.out(1.7)" }, 9.45);

      // 16.0s: "FIRST VIDEO" -> Settle back to 1.0x
      tl.to("#footage", { scale: 1.0, duration: 0.25, ease: "power2.out" }, 16.0);

      // 26.0s: "VERY SHY" -> Punch-in 1.15x
      tl.to("#footage", { scale: 1.15, duration: 0.25, ease: "back.out(1.5)" }, 26.0);

      // 37.8s: "CAME OUT OF MY SHELL" -> Punch-in 1.18x
      tl.to("#footage", { scale: 1.18, duration: 0.25, ease: "back.out(1.7)" }, 37.8);

      // 43.5s: "OUTRO" -> Settle back to 1.0x
      tl.to("#footage", { scale: 1.0, duration: 0.25, ease: "power2.out" }, 43.5);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
